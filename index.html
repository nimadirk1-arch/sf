<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Where in the world?</title>
    <link rel="stylesheet" href="main.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <h1>Where in the world?</h1>
        <button class="theme-toggle">
            Dark Mode
        </button>
    </header>

    <main class="container">
        <div class="controls">
            <input type="text" class="search-input" placeholder="Search for a country...">
        </div>

        <div class="grid">
            <article class="card">
                <img src="https://flagcdn.com/w320/de.png" alt="Germany Flag">
                <div class="card-info">
                    <h2>Germany</h2>
                </div>
            </article>
            
            <article class="card">
                <img src="https://flagcdn.com/w320/us.png" alt="USA Flag">
                <div class="card-info">
                    <h2>United States of America</h2>
                </div>
            </article>

            <article class="card">
                <img src="https://flagcdn.com/w320/br.png" alt="Brazil Flag">
                <div class="card-info">
                    <h2>Brazil</h2>
                </div>
            </article>

            <article class="card">
                <img src="https://flagcdn.com/w320/is.png" alt="Iceland Flag">
                <div class="card-info">
                    <h2>Iceland</h2>
                </div>
            </article>
        </div>
    </main>
</body>
</html>
